name: Windows V2 Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry / git / build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/lumina_scan/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/lumina_scan/Cargo.lock', 'native/lumina_scan/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build, test, and package
        run: python scripts/build.py

      - name: Sanity-check Lumina.exe
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Lumina.exe")) {
            Write-Error "dist/Lumina.exe missing"
            exit 1
          }
          Get-Item "dist/Lumina.exe" | Select-Object Name, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumina-windows
          path: dist/Lumina.exe
          retention-days: 14
          if-no-files-found: error
